<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Love letter for crush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="love letter 2.css" />
  </head>
  <body>
    <audio id="bgAudio" autoplay loop playsinline preload="auto">
      <source src="Kunmie-I-Admit.mp3" type="audio/mpeg">
    </audio>

    <h3>MY HEALER🥺❤️</h3>
    <div class="envelope-wrapper">
      <div id="envelope" class="close">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
          <div class="words line1">To:Iya Alamala</div>
          <div class="words line2">Oremiii,you are so beautiful</div>
          <div class="words line3">that every time i see you</div>
          <div class="words line4">my world stops.🥺🫂</div>
        </div>
        <div class="hearts">
          <div class="heart a1"></div>
          <div class="heart a2"></div>
          <div class="heart a3"></div>
        </div>
      </div>
    </div>
    <div class="reset">
      <button id="open">Open</button>
      <button id="reset">Close</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="love letter 2.js"></script>

    <script>
      // Try to start playback immediately when the DOM is ready.
      document.addEventListener('DOMContentLoaded', function () {
        const audio = document.getElementById('bgAudio');
        if (!audio) return;
        audio.volume = 0.7; // set preferred default volume

        // Programmatic play attempt (may be blocked by browser autoplay policies)
        const p = audio.play();
        if (p !== undefined) {
          p.then(() => {
            console.log('Background audio playing.');
          }).catch((err) => {
            console.warn('Autoplay was blocked by the browser:', err);
            // Note: We are not showing a play button per your request.
            // If playback is blocked, the browser requires a user gesture to start audio.
          });
        }

        // Also try to start when the "Open" button is clicked (in case autoplay was blocked earlier)
        const openBtn = document.getElementById('open');
        if (openBtn) {
          openBtn.addEventListener('click', function () {
            audio.play().catch(() => { /* silent fail if blocked */ });
          });
        }
      });
    </script>
  </body>
</html>
